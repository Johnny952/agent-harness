<!doctype html>
{#
  Every screen's frame. One <style> block and no static/ directory: there is no
  build step here (docs/charter.md C-8 bought Node for front/ alone), and a
  stylesheet served from a second route buys nothing a four-table board can
  spend.

  The presentation floor is the spec's and goes no further: real tables with real
  headers, focus order following reading order, prefers-color-scheme respected
  and nothing else themed, readable at 320px with no horizontal scrollbar. This
  gets opened at 2am on a laptop.
#}
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}board{% endblock %} — ia-harness</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #595959;
    --rule: #d0d0d0;
    --warn-fg: #6b4400;
    --warn-bg: #fff6e0;
    --bad-fg: #8c1c13;
    --bad-bg: #fdeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8;
      --bg: #161616;
      --muted: #a8a8a8;
      --rule: #3a3a3a;
      --warn-fg: #ffd694;
      --warn-bg: #3a2c0c;
      --bad-fg: #ffb3ac;
      --bad-bg: #401713;
    }
  }
  body {
    margin: 0 auto;
    padding: 1rem;
    max-width: 70rem;
    color: var(--fg);
    background: var(--bg);
    font: 1rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  a { color: inherit; }
  header { border-bottom: 1px solid var(--rule); padding-bottom: .5rem; }
  nav a { margin-right: 1rem; }
  .stamp { color: var(--muted); }
  h2 { font-size: 1rem; margin: 1.5rem 0 .25rem; }
  p { margin: .25rem 0; }
  table { border-collapse: collapse; width: 100%; }
  /* Wrapping rather than scrolling: the floor is 320px with no horizontal
     scrollbar, and a monospace id column is the first thing to overflow one. */
  th, td {
    border-bottom: 1px solid var(--rule);
    padding: .3rem .5rem .3rem 0;
    text-align: left;
    vertical-align: top;
    overflow-wrap: anywhere;
  }
  th { color: var(--muted); font-weight: normal; }
  .muted { color: var(--muted); }
  .warnings {
    margin: .25rem 0;
    padding: .4rem .6rem;
    list-style: none;
    color: var(--warn-fg);
    background: var(--warn-bg);
  }
  .warnings li + li { margin-top: .3rem; }
  .error { padding: .4rem .6rem; color: var(--bad-fg); background: var(--bad-bg); }
  .bad { color: var(--bad-fg); font-weight: bold; }
  .mark { color: var(--warn-fg); }
</style>
</head>
<body>
<header>
  <nav>
    <a href="{{ url_for('index') }}">pool and work</a>
    <a href="{{ url_for('events') }}">events</a>
    <a href="{{ url_for('debt') }}">debt</a>
  </nav>
  {# The page is stale the moment it renders: no push, no poll, so every screen
     is a snapshot and says when it was taken, beside the one control that makes
     a newer one. #}
  <p class="stamp">as of {{ as_of }} UTC · <a href="{{ request.full_path.rstrip('?') }}">reload</a></p>
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
