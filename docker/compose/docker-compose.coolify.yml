# docker/compose/docker-compose.coolify.yml
#
# Single-file variant of docker-compose.yml + docker-compose.agents.yml,
# meant to be imported as ONE Coolify "Docker Compose" resource for a
# one-shot deploy. Differences from the split files (which remain the
# recommended layout for manual/host `docker compose` use — see the two
# files above and the README):
#
#   - Every image builds from source (agent, dind-sidecar included), so
#     nothing has to be `docker build`'d by hand before first deploy.
#   - `claude_shared`/`claude_creds_<account>` are plain named volumes here,
#     not `external: true` — Coolify/Compose creates them on first `up`, so
#     `scripts/setup_volumes.sh` is not required. The tradeoff: removing this
#     resource in Coolify with its "delete volumes" option ticked deletes the
#     Claude OAuth sessions along with it, where the split files' external
#     volumes deliberately survive a `docker compose down`. `claude_shared`
#     mounts at `/root/.claude` on every agent and holds only the names every
#     account shares (session history, skills/agents/commands/plugins,
#     settings.json), symlinked into place by the agent image entrypoint.
#     Each `claude_creds_<account>` mounts at `/root/.claude-account`
#     (`CLAUDE_CONFIG_DIR`, set in docker/agent/Dockerfile) and holds that
#     account's login and everything else per-account (except
#     `.device-keys.json`, whose path the CLI hardcodes to /root/.claude).
#   - `ia_harness_net` is a plain network owned by this file, not split
#     across two files joined via `external: true`.
#   - Cloned project repos still bind-mount `<repo-root>/.data/projects`
#     (see docker-compose.agents.yml's comment) rather than using a volume.
#   - `dispatcher` is gated behind the `dispatcher` Compose profile so it
#     never starts as part of the resource's default `up` — Coolify (or you,
#     over SSH) runs it ad hoc. See the README's "Deploying with Coolify"
#     section.
#
# Still required before/at first deploy, same as the split-file path:
#   - A config.yaml at the repo root (e.g. via a Coolify pre-deployment
#     command: `test -f config.yaml || cp config.example.yaml config.yaml` —
#     config.yaml holds no secrets, only paths/thresholds/account names, so
#     the shipped example is a safe default for the stock cuenta1/cuenta2
#     setup).
#   - DASHBOARD_USERNAME / DASHBOARD_PASSWORD_HASH set as Coolify environment
#     variables on this resource (Coolify substitutes ${VARS} into compose
#     the same way a .env file would — no need to run scripts/configure.sh's
#     credentials wizard for a Coolify deploy). They keep their DASHBOARD_
#     names although the dashboard is gone: renaming them means editing the
#     environment of every running deploy to buy a spelling.
#   - API_TOKEN, likewise, if the board is to reach the api: any long random
#     string, the same value on both services. Without it the api still starts
#     and still serves a human's basic auth, and the board's every region shows
#     its Error state saying so.
#   - Per-account Claude Pro OAuth login, done once per agent container after
#     it's up (`docker exec -it agent-cuenta1 claude login` or equivalent) —
#     inherently a manual, interactive step no compose file can automate.
services:
  # Off by default, like in docker-compose.yml: this image is unpullable
  # anonymously, and Compose pre-pulls every named image before starting any
  # service. Deploy it with `--profile kanban` once `image:` points at
  # something you can pull. The dispatcher never dials it — Vibe Kanban's MCP
  # server speaks stdio, so this is the web UI only.
  vibe-kanban:
    profiles: ["kanban"]
    image: ghcr.io/bloopai/vibe-kanban:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - vibe_kanban_data:/data
    networks:
      - ia_harness_net

  collector:
    build:
      context: ../..
      dockerfile: observability/collector/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - observability_data:/data
    environment:
      - COLLECTOR_DB_PATH=/data/events.db
    networks:
      - ia_harness_net

  # The read API (docs/plans/board.md Phase 1), mirrored from
  # docker-compose.yml: this file is the one-resource deploy path, so a service
  # only the split files carry is a service a Coolify deployment silently does
  # not have. tests/integration/test_compose_invariants.py asserts both files
  # on the same two properties — no docker socket, and every mount :ro but the
  # one named in API_WRITABLE_MOUNTS.
  api:
    build:
      context: ../..
      dockerfile: observability/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      # Not under /data: that is where the two bind mounts below live in the
      # dispatcher's and the agents' layout, and nesting the volume under them
      # to keep COLLECTOR_DB_PATH byte-identical with the collector's would
      # trade a legible mount list for an environment variable.
      #
      # The one mount here that is not :ro, and the only one that cannot be
      # (docs/debt/T-009-D4.md): the collector keeps events.db in WAL mode, and
      # SQLite creates the `-shm` sidecar beside the file even for a read-only
      # open, which a :ro mount refuses — so /api/events answered [] plus a
      # warning that read like a missing database on every request. The API
      # still opens it with `mode=ro` in the URI and never calls init_db, so
      # what this grants is the sidecar, not the rows.
      - observability_data:/events
      - ../../dispatcher_state:/state:ro
      - ../../.hive:/data/.hive:ro
      - ../../.data/projects:/data/projects:ro
      - ../../config.yaml:/app/config.yaml:ro
    environment:
      - COLLECTOR_DB_PATH=/events/events.db
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME}
      - DASHBOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH}
      # The board's credential, not a human's, and optional: an api started
      # without it rejects every bearer and keeps basic auth working. See
      # docker-compose.yml and docs/decisions.md ADR 7.
      - API_TOKEN=${API_TOKEN:-}
    depends_on:
      - collector
    networks:
      - ia_harness_net

  # The board (docs/plans/board.md Phase 2), mirrored from docker-compose.yml
  # like the api above: this file is the one-resource deploy path, so a service
  # only the split files carry is a service a Coolify deployment silently does
  # not have. It replaces the `dashboard` service this file used to define —
  # /events supersedes those three columns and adds the states they never had.
  #
  # No volumes, which the invariants test pins on this file too: the board reads
  # nothing from disk and is an HTTP client of the api and nothing else.
  board:
    build:
      context: ../..
      dockerfile: observability/board/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      - API_BASE_URL=http://api:8789
      - API_TOKEN=${API_TOKEN:-}
      - BOARD_USERNAME=${DASHBOARD_USERNAME}
      - BOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH}
      # Optional; unset is right for a harness with one project checkout. See
      # docs/decisions.md ADR 9.
      - BOARD_PROJECT=${BOARD_PROJECT:-}
    depends_on:
      - api
    networks:
      - ia_harness_net

  registry-mirror:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_mirror_data:/var/lib/registry
      - ../registry-mirror/config.yml:/etc/docker/registry/config.yml:ro
    networks:
      - ia_harness_net

  # Not a persistent service: gated behind the "dispatcher" profile so
  # `docker compose up` / Coolify's default deploy never starts it. Run it
  # ad hoc: `docker compose -f docker-compose.coolify.yml --profile dispatcher
  # run --rm dispatcher --config /app/config.yaml run-task --task-id <id>
  # --project <slug>`.
  dispatcher:
    profiles: ["dispatcher"]
    build:
      context: ../..
      dockerfile: docker/dispatcher/Dockerfile
    restart: "no"
    command: ["--config", "/app/config.yaml", "run-task", "--task-id", "CHANGE_ME", "--project", "CHANGE_ME"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../dispatcher_state:/state
      - ../../.hive:/data/.hive
      - claude_shared:/root/.claude
      - ../../config.yaml:/app/config.yaml:ro
    depends_on:
      # Not vibe-kanban: nothing dials it, and a profiled service would drag
      # its unpullable image back into every deploy.
      - collector
    networks:
      - ia_harness_net

  agent-cuenta1:
    build:
      context: ../..
      dockerfile: docker/agent/Dockerfile
    container_name: agent-cuenta1
    restart: unless-stopped
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_HOST=tcp://dind-cuenta1:2375
      - COLLECTOR_URL=http://collector:8787
      - SOURCE_APP=agent-cuenta1
    volumes:
      # See the header comment above: claude_shared is the shared allowlist,
      # claude_creds_cuenta1 is this account's own config home.
      - claude_shared:/root/.claude
      - claude_creds_cuenta1:/root/.claude-account
      - ../../.data/projects:/data/projects
      - ../../.hive:/data/.hive
    depends_on:
      - dind-cuenta1
    networks:
      - ia_harness_net

  dind-cuenta1:
    build:
      context: ../dind-sidecar
      dockerfile: Dockerfile
    container_name: dind-cuenta1
    restart: unless-stopped
    runtime: sysbox-runc
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["--registry-mirror=http://registry-mirror:5000"]
    volumes:
      - dind_cuenta1_data:/var/lib/docker
    networks:
      - ia_harness_net

  agent-cuenta2:
    build:
      context: ../..
      dockerfile: docker/agent/Dockerfile
    container_name: agent-cuenta2
    restart: unless-stopped
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_HOST=tcp://dind-cuenta2:2375
      - COLLECTOR_URL=http://collector:8787
      - SOURCE_APP=agent-cuenta2
    volumes:
      # See agent-cuenta1 above.
      - claude_shared:/root/.claude
      - claude_creds_cuenta2:/root/.claude-account
      - ../../.data/projects:/data/projects
      - ../../.hive:/data/.hive
    depends_on:
      - dind-cuenta2
    networks:
      - ia_harness_net

  dind-cuenta2:
    build:
      context: ../dind-sidecar
      dockerfile: Dockerfile
    container_name: dind-cuenta2
    restart: unless-stopped
    runtime: sysbox-runc
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["--registry-mirror=http://registry-mirror:5000"]
    volumes:
      - dind_cuenta2_data:/var/lib/docker
    networks:
      - ia_harness_net

networks:
  ia_harness_net:
    name: ia_harness_net

volumes:
  vibe_kanban_data:
  observability_data:
  registry_mirror_data:
  claude_shared:
  claude_creds_cuenta1:
  claude_creds_cuenta2:
  dind_cuenta1_data:
  dind_cuenta2_data:
