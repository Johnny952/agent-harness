# docker/compose/docker-compose.coolify.yml
#
# Single-file variant of docker-compose.yml + docker-compose.agents.yml,
# meant to be imported as ONE Coolify "Docker Compose" resource for a
# one-shot deploy. Differences from the split files (which remain the
# recommended layout for manual/host `docker compose` use — see the two
# files above and the README):
#
#   - Every image builds from source (agent, dind-sidecar included), so
#     nothing has to be `docker build`'d by hand before first deploy.
#   - `claude_shared`/`claude_creds_<account>` are plain named volumes here,
#     not `external: true` — Coolify/Compose creates them on first `up`, so
#     `scripts/setup_volumes.sh` is not required. The tradeoff: removing this
#     resource in Coolify with its "delete volumes" option ticked deletes the
#     Claude OAuth sessions along with it, where the split files' external
#     volumes deliberately survive a `docker compose down`. `claude_shared`
#     mounts at `/root/.claude` on every agent and holds only the names every
#     account shares (session history, skills/agents/commands/plugins,
#     settings.json), symlinked into place by the agent image entrypoint.
#     Each `claude_creds_<account>` mounts at `/root/.claude-account`
#     (`CLAUDE_CONFIG_DIR`, set in docker/agent/Dockerfile) and holds that
#     account's login and everything else per-account (except
#     `.device-keys.json`, whose path the CLI hardcodes to /root/.claude).
#   - `ia_harness_net` is a plain network owned by this file, not split
#     across two files joined via `external: true`.
#   - Cloned project repos still bind-mount `<repo-root>/.data/projects`
#     (see docker-compose.agents.yml's comment) rather than using a volume, and
#     so do the projects' SSH deploy keys, `<repo-root>/.data/credentials/
#     projects` (writable in the dispatcher, :ro in the agents). The https://
#     `git-credentials` file is not mounted here (docs/decisions.md ADR 91).
#   - `dispatcher` is gated behind the `dispatcher` Compose profile so it
#     never starts as part of the resource's default `up` — Coolify (or you,
#     over SSH) runs it ad hoc. See the README's "Deploying with Coolify"
#     section.
#   - `worker` is gated the same way, behind the `worker` profile: the one
#     long-running service with the docker socket, started with
#     `--profile worker up -d worker` (docs/decisions.md ADR 142, ADR 166).
#   - `playwright-install` is gated the same way, behind its own profile: a
#     one-shot that fills `<repo-root>/.data/ms-playwright` with the headless
#     Chromium the agents mount :ro (docs/decisions.md ADR 43,
#     docs/plans/browser.md). Run it once after the first deploy and again
#     whenever docker/agent/Dockerfile's PLAYWRIGHT_VERSION moves.
#
# Still required before/at first deploy, same as the split-file path:
#   - A config.yaml at the repo root (e.g. via a Coolify pre-deployment
#     command: `test -f config.yaml || cp config.example.yaml config.yaml` —
#     config.yaml holds no secrets, only paths/thresholds/account names, so
#     the shipped example is a safe default for the cuenta1/cuenta2 pool;
#     for another pool, place the config.yaml scripts/configure.sh wrote --
#     the run that also rendered this file's agent pairs for that pool).
#   - DASHBOARD_USERNAME / DASHBOARD_PASSWORD_HASH set as Coolify environment
#     variables on this resource (Coolify substitutes ${VARS} into compose
#     the same way a .env file would — no need to run scripts/configure.sh's
#     credentials wizard for a Coolify deploy). They keep their DASHBOARD_
#     names although the dashboard is gone: renaming them means editing the
#     environment of every running deploy to buy a spelling.
#   - API_TOKEN, likewise: any long random string, shared by the api and the
#     `console` service below. Required, since the console refuses to start
#     without it (docs/decisions.md ADR 97). CONSOLE_PROJECT is optional.
#   - CONFIG_WRITER_TOKEN, likewise: a long random string shared by the
#     `config-writer` service and the `console`. The writer exits 2 without
#     it (docs/decisions.md ADR 75, ADR 109). `config.d/` next to config.yaml
#     should exist before the first deploy (scripts/configure.sh makes it);
#     otherwise docker creates it root-owned, which the root writer can still
#     use (ADR 110).
#   - BOARD_ACTIONS_TOKEN, optional: a long random string shared by the
#     `board-service` and the `console`. Without it the console's Start and
#     Cancel answer 503 (docs/decisions.md ADR 157).
#   - COLLECTOR_READ_TOKEN and one COLLECTOR_WRITE_TOKEN_<ACCOUNT> per
#     account (docs/decisions.md ADR 72; <ACCOUNT> is the account name
#     uppercased, `-` as `_`): distinct long random strings, the ones
#     collector's COLLECTOR_WRITE_TOKENS line below names. Like API_TOKEN
#     these are required — the collector refuses to start without
#     them. The read token is what an
#     operator sends to `GET /events`; each write token goes to its agent and
#     the collector only.
#   - Per-account Claude Pro OAuth login, done once per agent container after
#     it's up (`docker exec -it agent-<account> claude login` or equivalent) —
#     inherently a manual, interactive step no compose file can automate.
services:
  collector:
    build:
      context: ../..
      dockerfile: observability/collector/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - observability_data:/data
    environment:
      - COLLECTOR_DB_PATH=/data/events.db
      # docs/decisions.md ADR 72, mirrored from docker-compose.yml: both
      # required, the read token given to no other service, and one
      # `<source_app>=<token>` entry per agent below.
      - COLLECTOR_READ_TOKEN=${COLLECTOR_READ_TOKEN}
      - COLLECTOR_WRITE_TOKENS=agent-cuenta1=${COLLECTOR_WRITE_TOKEN_CUENTA1},agent-cuenta2=${COLLECTOR_WRITE_TOKEN_CUENTA2}
    networks:
      - ia_harness_net

  # The read API (docs/plans/board.md Phase 1), mirrored from
  # docker-compose.yml: this file is the one-resource deploy path, so a service
  # only the split files carry is a service a Coolify deployment silently does
  # not have. tests/integration/test_compose_invariants.py asserts both files
  # on the same two properties — no docker socket, and every mount :ro but the
  # one named in API_WRITABLE_MOUNTS.
  api:
    build:
      context: ../..
      dockerfile: observability/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      # Not under /data: that is where the two bind mounts below live in the
      # dispatcher's and the agents' layout, and nesting the volume under them
      # to keep COLLECTOR_DB_PATH byte-identical with the collector's would
      # trade a legible mount list for an environment variable.
      #
      # The one mount here that is not :ro, and the only one that cannot be
      # (docs/debt/T-009-D4.md): the collector keeps events.db in WAL mode, and
      # SQLite creates the `-shm` sidecar beside the file even for a read-only
      # open, which a :ro mount refuses — so /api/events answered [] plus a
      # warning that read like a missing database on every request. The API
      # still opens it with `mode=ro` in the URI and never calls init_db, so
      # what this grants is the sidecar, not the rows.
      - observability_data:/events
      - ../../dispatcher_state:/state:ro
      - ../../.hive:/data/.hive:ro
      - ../../.data/projects:/data/projects:ro
      - ../../config.yaml:/app/config.yaml:ro
      - ../../config.d:/app/config.d:ro
    environment:
      - COLLECTOR_DB_PATH=/events/events.db
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME}
      - DASHBOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH}
      # A service's credential, not a human's. The api runs without it, the
      # console does not, so it is bare in both. See docker-compose.yml and
      # docs/decisions.md ADR 7 and ADR 97.
      - API_TOKEN=${API_TOKEN}
    depends_on:
      - collector
    networks:
      # ia_harness_net for the collector, console_net so the console reaches it.
      - ia_harness_net
      - console_net

  # The console, mirrored from docker-compose.yml (see its comment): no volume,
  # no docker socket, API_TOKEN, CONFIG_WRITER_TOKEN and BOARD_ACTIONS_TOKEN. Published on
  # loopback like the services around it; docs/decisions.md ADR 97. On
  # console_net only (ADR 109). Coolify's proxy reaches it over the network
  # Coolify attaches itself, not ia_harness_net (ADR 109 *Coolify*).
  console:
    build:
      context: ../..
      dockerfile: docker/console/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      - API_BASE_URL=http://api:8789
      - API_TOKEN=${API_TOKEN}
      - CONSOLE_PROJECT=${CONSOLE_PROJECT:-}
      - CONFIG_WRITER_URL=http://config-writer:8791
      - CONFIG_WRITER_TOKEN=${CONFIG_WRITER_TOKEN}
      # Optional: the action routes answer 503 without it (ADR 157).
      - BOARD_ACTIONS_TOKEN=${BOARD_ACTIONS_TOKEN:-}
    depends_on:
      - api
    networks:
      - console_net

  # The settings writer, mirrored from docker-compose.yml (see its comment):
  # config.yaml :ro and config.d the one writable mount, no socket, console_net
  # only; docs/decisions.md ADR 75, ADR 109 and ADR 110.
  config-writer:
    build:
      context: ../..
      dockerfile: config_writer/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - ../../config.yaml:/app/config.yaml:ro
      - ../../config.d:/app/config.d
    environment:
      - CONFIG_WRITER_TOKEN=${CONFIG_WRITER_TOKEN}
    networks:
      - console_net

  # The board service, mirrored from docker-compose.yml (see its comment):
  # the hive read-write and config :ro, no socket, ia_harness_net and
  # console_net, loopback 8792; docs/decisions.md ADR 124, ADR 125 and ADR 129.
  # Plus the `actions` queue mount and the optional BOARD_ACTIONS_TOKEN (ADR 142
  # decision 3, ADR 166).
  board-service:
    build:
      context: ../..
      dockerfile: board_service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8792:8792"
    volumes:
      - ../../.hive:/data/.hive
      - ../../config.yaml:/app/config.yaml:ro
      - ../../config.d:/app/config.d:ro
      - ../../dispatcher_state/actions:/state/actions
      - ../../.data/credentials/vapid-private.pem:/run/secrets/vapid-private.pem:ro
    environment:
      - BOARD_ACTIONS_TOKEN=${BOARD_ACTIONS_TOKEN:-}
    networks:
      - ia_harness_net
      - console_net

  registry-mirror:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_mirror_data:/var/lib/registry
      - ../registry-mirror/config.yml:/etc/docker/registry/config.yml:ro
    networks:
      - ia_harness_net

  # Not a persistent service: gated behind the "dispatcher" profile so
  # `docker compose up` / Coolify's default deploy never starts it. Run it
  # ad hoc: `docker compose -f docker-compose.coolify.yml --profile dispatcher
  # run --rm dispatcher --config /app/config.yaml run-task --task-id <id>
  # --project <slug>`.
  dispatcher:
    profiles: ["dispatcher"]
    build:
      context: ../..
      dockerfile: docker/dispatcher/Dockerfile
    restart: "no"
    command: ["--config", "/app/config.yaml", "run-task", "--task-id", "CHANGE_ME", "--project", "CHANGE_ME"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../dispatcher_state:/state
      - ../../.hive:/data/.hive
      - claude_shared:/root/.claude
      # Writable so `project-keygen` can write a key pair; the agents get it
      # :ro. See docker-compose.yml's dispatcher.
      - ../../.data/credentials/projects:/run/secrets/projects
      - ../../config.yaml:/app/config.yaml:ro
      # The writer's overrides, read-only here; see docker-compose.yml.
      - ../../config.d:/app/config.d:ro
    depends_on:
      - collector
    networks:
      - ia_harness_net

  # The worker, mirrored from docker-compose.yml (see its comment): the one
  # long-running service with the docker socket, behind the `worker` profile,
  # with the dispatcher's mounts; docs/decisions.md ADR 142 and ADR 166.
  worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: docker/dispatcher/Dockerfile
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "worker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../dispatcher_state:/state
      - ../../.hive:/data/.hive
      - claude_shared:/root/.claude
      - ../../.data/credentials/projects:/run/secrets/projects
      - ../../config.yaml:/app/config.yaml:ro
      - ../../config.d:/app/config.d:ro
    depends_on:
      - collector
    networks:
      - ia_harness_net

  # The browser install, mirrored from docker-compose.yml (see its comment):
  # the agent image with its entrypoint replaced, behind the
  # `playwright-install` profile, the only writable mount of the browser
  # directory. Built from source like the agents here, from the same
  # Dockerfile, so the version it installs is theirs.
  playwright-install:
    profiles: ["playwright-install"]
    build:
      context: ../..
      dockerfile: docker/agent/Dockerfile
    restart: "no"
    entrypoint: ["playwright", "install", "chromium-headless-shell"]
    volumes:
      - ../../.data/ms-playwright:/ms-playwright
    networks:
      - ia_harness_net

  agent-cuenta1:
    build:
      context: ../..
      dockerfile: docker/agent/Dockerfile
    container_name: agent-cuenta1
    restart: unless-stopped
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_HOST=tcp://dind-cuenta1:2375
      - COLLECTOR_URL=http://collector:8787
      - SOURCE_APP=agent-cuenta1
      # This agent's write token and no other (ADR 72); never the read token.
      - COLLECTOR_TOKEN=${COLLECTOR_WRITE_TOKEN_CUENTA1}
    volumes:
      # See the header comment above: claude_shared is the shared allowlist,
      # claude_creds_cuenta1 is this account's own config home.
      - claude_shared:/root/.claude
      - claude_creds_cuenta1:/root/.claude-account
      - ../../.data/projects:/data/projects
      - ../../.hive:/data/.hive
      # Each project's SSH deploy key, read-only; see docker-compose.agents.yml's
      # agent-cuenta1 comment. The https:// git-credentials file is not mounted
      # here (ADR 91).
      - ../../.data/credentials/projects:/run/secrets/projects:ro
      # The headless Chromium build, read-only; see docker-compose.agents.yml's
      # agent-cuenta1 comment and the playwright-install service above.
      - ../../.data/ms-playwright:/ms-playwright:ro
    depends_on:
      - dind-cuenta1
    networks:
      - ia_harness_net

  dind-cuenta1:
    build:
      context: ../dind-sidecar
      dockerfile: Dockerfile
    container_name: dind-cuenta1
    restart: unless-stopped
    runtime: sysbox-runc
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["--registry-mirror=http://registry-mirror:5000"]
    volumes:
      - dind_cuenta1_data:/var/lib/docker
      # The projects tree at the agent's path. The agent runs `docker compose`
      # against this daemon from /data/projects/<slug>, and the daemon resolves
      # the project's bind mounts on its own filesystem, so the path must exist
      # here too. A `service` command request's project lives here (ADR 118).
      - ../../.data/projects:/data/projects
    networks:
      - ia_harness_net

  agent-cuenta2:
    build:
      context: ../..
      dockerfile: docker/agent/Dockerfile
    container_name: agent-cuenta2
    restart: unless-stopped
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_HOST=tcp://dind-cuenta2:2375
      - COLLECTOR_URL=http://collector:8787
      - SOURCE_APP=agent-cuenta2
      - COLLECTOR_TOKEN=${COLLECTOR_WRITE_TOKEN_CUENTA2}
    volumes:
      # See agent-cuenta1 above.
      - claude_shared:/root/.claude
      - claude_creds_cuenta2:/root/.claude-account
      - ../../.data/projects:/data/projects
      - ../../.hive:/data/.hive
      # See agent-cuenta1 above: the deploy keys, read-only.
      - ../../.data/credentials/projects:/run/secrets/projects:ro
      # See agent-cuenta1 above: the browser build, read-only.
      - ../../.data/ms-playwright:/ms-playwright:ro
    depends_on:
      - dind-cuenta2
    networks:
      - ia_harness_net

  dind-cuenta2:
    build:
      context: ../dind-sidecar
      dockerfile: Dockerfile
    container_name: dind-cuenta2
    restart: unless-stopped
    runtime: sysbox-runc
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["--registry-mirror=http://registry-mirror:5000"]
    volumes:
      - dind_cuenta2_data:/var/lib/docker
      # The projects tree at the agent's path. The agent runs `docker compose`
      # against this daemon from /data/projects/<slug>, and the daemon resolves
      # the project's bind mounts on its own filesystem, so the path must exist
      # here too. A `service` command request's project lives here (ADR 118).
      - ../../.data/projects:/data/projects
    networks:
      - ia_harness_net

networks:
  ia_harness_net:
    name: ia_harness_net
  console_net:

volumes:
  observability_data:
  registry_mirror_data:
  claude_shared:
  claude_creds_cuenta1:
  claude_creds_cuenta2:
  dind_cuenta1_data:
  dind_cuenta2_data:
