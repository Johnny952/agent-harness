# docker/compose/docker-compose.agents.yml
# One agent+sidecar block per Claude Pro account. Duplicate the pair for
# additional accounts — no dispatcher code changes required (design spec,
# "Decisiones de alcance": N accounts without structural changes).
#
# Bring up docker-compose.yml first: it creates `ia_harness_net`, which this
# file joins as an external network so agents and sidecars can resolve
# `collector`, `registry-mirror` and `vibe-kanban` by service name.
services:
  agent-cuenta1:
    image: ia-harness-agent
    container_name: agent-cuenta1
    restart: unless-stopped
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_HOST=tcp://dind-cuenta1:2375
      # Consumed by hooks/emit_event.py, registered into Claude Code's
      # settings.json by the agent image entrypoint.
      - COLLECTOR_URL=http://collector:8787
      - SOURCE_APP=agent-cuenta1
    volumes:
      - claude_shared:/root/.claude
      - claude_creds_cuenta1:/root/.claude/credentials
      # Repo-relative bind mount (not a named volume) so cloned project repos
      # live at <repo-root>/.data/projects on the host, inspectable directly.
      # NOTE: the agent image has no USER directive, so files written here
      # from inside the container will show up root-owned on the host.
      - ../../.data/projects:/data/projects
      # Agents read their task file (lock owner, role, handoff notes) from
      # here; the dispatcher is the only writer. Path matches config.yaml's
      # `hive_tasks_dir: /data/.hive/tasks`.
      - ../../.hive:/data/.hive
    depends_on:
      - dind-cuenta1
    networks:
      - ia_harness_net

  dind-cuenta1:
    image: ia-harness-dind-sidecar
    container_name: dind-cuenta1
    restart: unless-stopped
    runtime: sysbox-runc
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["--registry-mirror=http://registry-mirror:5000"]
    volumes:
      - dind_cuenta1_data:/var/lib/docker
    networks:
      - ia_harness_net

  agent-cuenta2:
    image: ia-harness-agent
    container_name: agent-cuenta2
    restart: unless-stopped
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_HOST=tcp://dind-cuenta2:2375
      - COLLECTOR_URL=http://collector:8787
      - SOURCE_APP=agent-cuenta2
    volumes:
      - claude_shared:/root/.claude
      - claude_creds_cuenta2:/root/.claude/credentials
      - ../../.data/projects:/data/projects
      - ../../.hive:/data/.hive
    depends_on:
      - dind-cuenta2
    networks:
      - ia_harness_net

  dind-cuenta2:
    image: ia-harness-dind-sidecar
    container_name: dind-cuenta2
    restart: unless-stopped
    runtime: sysbox-runc
    cpus: "2"
    mem_limit: "4g"
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["--registry-mirror=http://registry-mirror:5000"]
    volumes:
      - dind_cuenta2_data:/var/lib/docker
    networks:
      - ia_harness_net

networks:
  # Created by docker-compose.yml. `external: true` means this file joins it
  # rather than creating a second, isolated network.
  ia_harness_net:
    external: true
    name: ia_harness_net

volumes:
  claude_shared:
    external: true
  claude_creds_cuenta1:
    external: true
  claude_creds_cuenta2:
    external: true
  dind_cuenta1_data:
  dind_cuenta2_data:
