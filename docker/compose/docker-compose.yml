# docker/compose/docker-compose.yml
services:
  # Behind a profile, and off by default: `ghcr.io/bloopai/vibe-kanban:latest`
  # is private or does not exist (anonymous pulls are denied on a host where
  # other GHCR pulls work), and Compose pre-pulls every named image before
  # starting anything — so leaving this service in the default set made a
  # plain `up -d` fail for all four. Bring it up with
  # `--profile kanban` once `image:` points at something you can actually
  # pull (build it from upstream, or a vetted image of your own).
  #
  # Nothing in the harness reaches this service over the network: Vibe
  # Kanban's MCP server speaks stdio, so the dispatcher spawns its own
  # (`vibe_kanban.command` in config.yaml) rather than dialling a URL. This
  # is the web UI, for the human. The publish below stays bound to 127.0.0.1
  # per the spec's "control UI stays loopback-only" requirement (sec. 1).
  vibe-kanban:
    profiles: ["kanban"]
    image: ghcr.io/bloopai/vibe-kanban:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - vibe_kanban_data:/data
    networks:
      - ia_harness_net

  collector:
    build:
      context: ../..
      dockerfile: observability/collector/Dockerfile
    restart: unless-stopped
    ports:
      # Host-side access only; agents POST to http://collector:8787 over
      # ia_harness_net, not through this published port.
      - "127.0.0.1:8787:8787"
    volumes:
      - observability_data:/data
    environment:
      - COLLECTOR_DB_PATH=/data/events.db
    networks:
      - ia_harness_net

  # The read API (docs/plans/board.md "Phase 1 — a read API in Python"): GETs
  # over the task files, the account state, the events and the debt index, so
  # an operator — and Phase 2's UI — stops reading root-owned
  # dispatcher_state/*.json through a throwaway container.
  #
  # Every mount but the events volume is :ro and nothing here writes, which is
  # why it can be handed the dispatcher's own directories at the dispatcher's
  # own container paths: `state_dir: /state`, `hive_tasks_dir: /data/.hive/tasks`
  # and `projects_root: /data/projects` are true in this container too, so
  # config.yaml needs no key for this service. The events volume is the single
  # exception, forced by SQLite's WAL sidecar and argued at the mount itself.
  # It gets no docker socket: the dispatcher's readers arrive with it,
  # docker_exec included, and none of the latter is ever called.
  api:
    build:
      context: ../..
      dockerfile: observability/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      # Not under /data: that is where the two bind mounts below live in the
      # dispatcher's and the agents' layout, and nesting the volume under them
      # to keep COLLECTOR_DB_PATH byte-identical with the collector's would
      # trade a legible mount list for an environment variable.
      #
      # The one mount here that is not :ro, and the only one that cannot be
      # (docs/debt/T-009-D4.md): the collector keeps events.db in WAL mode, and
      # SQLite creates the `-shm` sidecar beside the file even for a read-only
      # open, which a :ro mount refuses — so /api/events answered [] plus a
      # warning that read like a missing database on every request. The API
      # still opens it with `mode=ro` in the URI and never calls init_db, so
      # what this grants is the sidecar, not the rows.
      - observability_data:/events
      - ../../dispatcher_state:/state:ro
      - ../../.hive:/data/.hive:ro
      - ../../.data/projects:/data/projects:ro
      - ../../config.yaml:/app/config.yaml:ro
    environment:
      - COLLECTOR_DB_PATH=/events/events.db
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME}
      - DASHBOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH}
      # The board's credential, not a human's: this service checks a hash, so a
      # service authenticating with basic auth would need the plaintext in .env
      # beside the hash and make the hash decorative. Optional — an api started
      # without it rejects every bearer and keeps basic auth working
      # (docs/decisions.md ADR 7) — so it is spelt `:-` like BOARD_PROJECT
      # below: a variable that is allowed to be unset should not be announced
      # as a missing one every time compose reads this file.
      - API_TOKEN=${API_TOKEN:-}
    depends_on:
      - collector
    networks:
      - ia_harness_net

  # The board (docs/plans/board.md "Phase 2 — a read-only board"): four screens
  # over the five endpoints above, server-rendered with Jinja — docs/charter.md
  # C-7 rules the toolchain, so there is no package.json and no build step here.
  #
  # NO VOLUMES, deliberately, and this is the one service in this file for which
  # the absence of a key is the design: the board reads nothing from disk — no
  # .hive/, no dispatcher_state/, no events database, no docker socket — and is
  # an HTTP client of the api and nothing else. That is the whole reason Phase 2
  # is cheap to reason about, so it is what
  # tests/integration/test_compose_invariants.py pins.
  #
  # The browser never talks to the api: every fetch is server-side, which is what
  # keeps the api's credential inside a container instead of in a page an
  # operator can view-source. The human authenticates to the board with the same
  # two DASHBOARD_ variables the api takes (they keep those names on purpose:
  # renaming them means editing a .env that exists on a running host); the board
  # authenticates to the api with API_TOKEN.
  board:
    build:
      context: ../..
      dockerfile: observability/board/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      - API_BASE_URL=http://api:8789
      - API_TOKEN=${API_TOKEN:-}
      - BOARD_USERNAME=${DASHBOARD_USERNAME}
      - BOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH}
      # Which project's debt index /debt shows. Optional: unset is right for a
      # harness with one checkout, because /api/debt picks when there is nothing
      # to pick between, and /debt?project=<slug> overrides it for one
      # navigation. docs/decisions.md ADR 9.
      - BOARD_PROJECT=${BOARD_PROJECT:-}
    depends_on:
      - api
    networks:
      - ia_harness_net

  registry-mirror:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_mirror_data:/var/lib/registry
      - ../registry-mirror/config.yml:/etc/docker/registry/config.yml:ro
    networks:
      # dind-cuenta* pass --registry-mirror=http://registry-mirror:5000, which
      # only resolves because they join this same network from the other file.
      - ia_harness_net

  # dispatcher.run_task_cycle (dispatcher/dispatcher.py) processes exactly
  # one task through the full role lifecycle and then exits — there is no
  # daemon/polling loop. This service is therefore single-shot per
  # invocation, not a long-running process: no restart policy is set, and
  # `command` below is an example invocation matching dispatcher/cli.py's
  # real argparse shape (`--config <path> run-task --task-id <id> --project
  # <slug>`). Override `command` (or use `docker compose run --rm
  # dispatcher ...`) with real --task-id/--project values per task.
  #
  # The `dispatcher` profile keeps that example `command` from ever running
  # by accident: without it a plain `docker compose up -d` starts this
  # service like any other and fires `run-task --task-id CHANGE_ME
  # --project CHANGE_ME` against a logged-in account, spending quota on a
  # task nobody asked for. A profiled service is skipped unless it is named
  # explicitly or its profile is enabled, so `docker compose run --rm
  # dispatcher ...` and `--profile dispatcher up` still work unchanged.
  # docker-compose.coolify.yml has carried this since it was written.
  dispatcher:
    profiles: ["dispatcher"]
    build:
      context: ../..
      dockerfile: docker/dispatcher/Dockerfile
    restart: "no"
    command: ["--config", "/app/config.yaml", "run-task", "--task-id", "CHANGE_ME", "--project", "CHANGE_ME"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../dispatcher_state:/state
      - ../../.hive:/data/.hive
      - claude_shared:/root/.claude
      # No config.yaml exists in this repo yet — the operator must copy
      # ../../config.example.yaml to ../../config.yaml (and adjust values)
      # at this host path before `docker compose up`.
      - ../../config.yaml:/app/config.yaml:ro
    depends_on:
      # Not vibe-kanban: the dispatcher never dials it, and depending on a
      # profiled service would drag its unpullable image back in.
      - collector
    networks:
      - ia_harness_net

networks:
  # Created by this file, joined as `external: true` by
  # docker-compose.agents.yml so agents/sidecars resolve collector and
  # registry-mirror by service name.
  ia_harness_net:
    name: ia_harness_net

volumes:
  vibe_kanban_data:
  observability_data:
  registry_mirror_data:
  claude_shared:
    external: true
