# docker/compose/docker-compose.yml
services:
  collector:
    build:
      context: ../..
      dockerfile: observability/collector/Dockerfile
    restart: unless-stopped
    ports:
      # Host-side access only; agents POST to http://collector:8787 over
      # ia_harness_net, not through this published port.
      - "127.0.0.1:8787:8787"
    volumes:
      - observability_data:/data
    environment:
      - COLLECTOR_DB_PATH=/data/events.db
      # docs/decisions.md ADR 72. Both required, bare `${VAR}` with no
      # default: the collector refuses to start without either rather than
      # serve the network unauthenticated. The read token is the operator's
      # alone and is given to no other service here or in
      # docker-compose.agents.yml.
      - COLLECTOR_READ_TOKEN=${COLLECTOR_READ_TOKEN}
      # One `<source_app>=<token>` entry per agent, the source_app spelt as
      # that agent's SOURCE_APP in docker-compose.agents.yml. The collector
      # stores the source_app its token is bound to, whatever the body says.
      # scripts/configure.sh writes the whole map into .env as
      # COLLECTOR_WRITE_TOKENS, one entry per configured account with the
      # token spelt out, so a pool other than cuenta1/cuenta2 needs no edit
      # here. The default is the map this line held before that, so a .env
      # written earlier, which has only the per-account variables, resolves
      # exactly as it did.
      - COLLECTOR_WRITE_TOKENS=${COLLECTOR_WRITE_TOKENS:-agent-cuenta1=${COLLECTOR_WRITE_TOKEN_CUENTA1},agent-cuenta2=${COLLECTOR_WRITE_TOKEN_CUENTA2}}
    networks:
      - ia_harness_net

  # The read API (docs/plans/board.md "Phase 1 — a read API in Python"): GETs
  # over the task files, the account state, the events and the debt index, so
  # an operator — and Phase 2's UI — stops reading root-owned
  # dispatcher_state/*.json through a throwaway container.
  #
  # Every mount but the events volume is :ro and nothing here writes, which is
  # why it can be handed the dispatcher's own directories at the dispatcher's
  # own container paths: `state_dir: /state`, `hive_tasks_dir: /data/.hive/tasks`
  # and `projects_root: /data/projects` are true in this container too, so
  # config.yaml needs no key for this service. The events volume is the single
  # exception, forced by SQLite's WAL sidecar and argued at the mount itself.
  # It gets no docker socket: the dispatcher's readers arrive with it,
  # docker_exec included, and none of the latter is ever called.
  api:
    build:
      context: ../..
      dockerfile: observability/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      # Not under /data: that is where the two bind mounts below live in the
      # dispatcher's and the agents' layout, and nesting the volume under them
      # to keep COLLECTOR_DB_PATH byte-identical with the collector's would
      # trade a legible mount list for an environment variable.
      #
      # The one mount here that is not :ro, and the only one that cannot be
      # (docs/debt/T-009-D4.md): the collector keeps events.db in WAL mode, and
      # SQLite creates the `-shm` sidecar beside the file even for a read-only
      # open, which a :ro mount refuses — so /api/events answered [] plus a
      # warning that read like a missing database on every request. The API
      # still opens it with `mode=ro` in the URI and never calls init_db, so
      # what this grants is the sidecar, not the rows.
      - observability_data:/events
      - ../../dispatcher_state:/state:ro
      - ../../.hive:/data/.hive:ro
      - ../../.data/projects:/data/projects:ro
      - ../../config.yaml:/app/config.yaml:ro
      - ../../config.d:/app/config.d:ro
    environment:
      - COLLECTOR_DB_PATH=/events/events.db
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME}
      - DASHBOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH}
      # A service's credential, not a human's: this service checks a hash, so a
      # service authenticating with basic auth would need the plaintext in .env
      # beside the hash and make the hash decorative. The holder is the console's
      # server half (`front/src/lib/api/forward.ts`, docs/decisions.md ADR 15 and
      # ADR 24), the `console` service below. The api itself still runs without
      # it — it then rejects every bearer and keeps basic auth working
      # (docs/decisions.md ADR 7) — but the console does not, so the one value
      # is spelt bare in both services (docs/decisions.md ADR 97): compose says
      # it is missing instead of starting a console that exits at boot.
      - API_TOKEN=${API_TOKEN}
    depends_on:
      - collector
    networks:
      # ia_harness_net for the collector, console_net so the console reaches it
      # (ADR 109).
      - ia_harness_net
      - console_net

  # The console (`front/`, docs/decisions.md ADR 15, ADR 24 and ADR 97): built
  # for Node by docker/console/Dockerfile. It reads only through the api, so it
  # has no volume and no docker socket, and it holds API_TOKEN,
  # CONFIG_WRITER_TOKEN and BOARD_ACTIONS_TOKEN: never COLLECTOR_READ_TOKEN or a write token. It is on
  # console_net only (ADR 109), so no agent container can call it.
  #
  # API_TOKEN is bare `${API_TOKEN}`: the console refuses to boot without it, so
  # compose should announce it missing rather than start a restart loop.
  # CONSOLE_PROJECT is optional (the console then asks for a project), so it is
  # `:-`. Published on loopback only: the `caddy` service below proxies to it
  # (docs/decisions.md ADR 100), and the loopback publish stays for an SSH
  # tunnel.
  console:
    build:
      context: ../..
      dockerfile: docker/console/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      - API_BASE_URL=http://api:8789
      - API_TOKEN=${API_TOKEN}
      - CONSOLE_PROJECT=${CONSOLE_PROJECT:-}
      # The settings screen's forward (task 3 of docs/plans/console-config.md).
      # The token is bare like API_TOKEN (ADR 109 part 4).
      - CONFIG_WRITER_URL=http://config-writer:8791
      - CONFIG_WRITER_TOKEN=${CONFIG_WRITER_TOKEN}
      # The queue's Start and Cancel (ADR 157). Optional: 503 without it.
      - BOARD_ACTIONS_TOKEN=${BOARD_ACTIONS_TOKEN:-}
    depends_on:
      - api
    networks:
      - console_net

  # The settings writer (docs/decisions.md ADR 75, ADR 109 and ADR 110): the one
  # service that changes config.d/overrides.yaml, validated by the dispatcher's
  # own load_config. Its mounts are config.yaml :ro and config.d, the one
  # writable mount; no docker socket, no .hive, no state, no credentials. It is
  # on console_net only, so no agent reaches it, and publishes loopback only for
  # a console run on the host. It exits 2 without CONFIG_WRITER_TOKEN.
  config-writer:
    build:
      context: ../..
      dockerfile: config_writer/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - ../../config.yaml:/app/config.yaml:ro
      - ../../config.d:/app/config.d
    environment:
      - CONFIG_WRITER_TOKEN=${CONFIG_WRITER_TOKEN}
    networks:
      - console_net

  # The board service (docs/decisions.md ADR 124, ADR 125 and ADR 129): the
  # board's MCP server and its write side. It reads and writes the hive through
  # dispatcher/tasks.py, under task_lock, so the hive is mounted read-write,
  # locks/ included; config is :ro. No docker socket, no .data, no projects, no
  # git credential: the pushes stay on the dispatcher. It is on ia_harness_net
  # for the phases (step 7) and on console_net for the console's writes
  # (step 5). It publishes loopback only, for the operator's Claude Code
  # session on the host.
  #
  # The one state mount is `actions` (ADR 142 decision 3, ADR 166), the queue
  # the worker drains; never the whole state dir. BOARD_ACTIONS_TOKEN gates the
  # action routes and is optional: they answer 503 without it (ADR 157).
  board-service:
    build:
      context: ../..
      dockerfile: board_service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8792:8792"
    volumes:
      - ../../.hive:/data/.hive
      - ../../config.yaml:/app/config.yaml:ro
      - ../../config.d:/app/config.d:ro
      - ../../dispatcher_state/actions:/state/actions
      - ../../.data/credentials/vapid-private.pem:/run/secrets/vapid-private.pem:ro
    environment:
      - BOARD_ACTIONS_TOKEN=${BOARD_ACTIONS_TOKEN:-}
    networks:
      - ia_harness_net
      - console_net

  # TLS in front of the console (docs/decisions.md ADR 100). In this file only:
  # in Coolify its own proxy ends TLS, and a second one would fight it for 80
  # and 443. The one service in any compose file that publishes on every
  # address, and the reason the others stay on 127.0.0.1. It gets no docker
  # socket and no state: the Caddyfile read-only plus two volumes of its own
  # (the certificates, so a restart does not ask Let's Encrypt again).
  # HARNESS_DOMAIN unset serves http://localhost with no certificate;
  # ACME_EMAIL is optional. Only the console is proxied, never the api.
  # The console asks for Basic auth (ADR 103): with no CONSOLE_AUTH_HASH Caddy
  # refuses its config and the rest of the stack still starts.
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - HARNESS_DOMAIN=${HARNESS_DOMAIN:-http://localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - CONSOLE_AUTH_USER=${CONSOLE_AUTH_USER:-console}
      - CONSOLE_AUTH_HASH=${CONSOLE_AUTH_HASH}
    depends_on:
      - console
    networks:
      - console_net

  registry-mirror:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_mirror_data:/var/lib/registry
      - ../registry-mirror/config.yml:/etc/docker/registry/config.yml:ro
    networks:
      # dind-cuenta* pass --registry-mirror=http://registry-mirror:5000, which
      # only resolves because they join this same network from the other file.
      - ia_harness_net

  # dispatcher.run_task_cycle (dispatcher/dispatcher.py) processes exactly
  # one task through the full role lifecycle and then exits — there is no
  # daemon/polling loop. This service is therefore single-shot per
  # invocation, not a long-running process: no restart policy is set, and
  # `command` below is an example invocation matching dispatcher/cli.py's
  # real argparse shape (`--config <path> run-task --task-id <id> --project
  # <slug>`). Override `command` (or use `docker compose run --rm
  # dispatcher ...`) with real --task-id/--project values per task.
  #
  # The `dispatcher` profile keeps that example `command` from ever running
  # by accident: without it a plain `docker compose up -d` starts this
  # service like any other and fires `run-task --task-id CHANGE_ME
  # --project CHANGE_ME` against a logged-in account, spending quota on a
  # task nobody asked for. A profiled service is skipped unless it is named
  # explicitly or its profile is enabled, so `docker compose run --rm
  # dispatcher ...` and `--profile dispatcher up` still work unchanged.
  # docker-compose.coolify.yml has carried this since it was written.
  dispatcher:
    profiles: ["dispatcher"]
    build:
      context: ../..
      dockerfile: docker/dispatcher/Dockerfile
    restart: "no"
    command: ["--config", "/app/config.yaml", "run-task", "--task-id", "CHANGE_ME", "--project", "CHANGE_ME"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../dispatcher_state:/state
      - ../../.hive:/data/.hive
      - claude_shared:/root/.claude
      # The projects' deploy keys, writable here and read-only in the agents:
      # `project-keygen` writes a pair at <slug>/id_ed25519, and only this side
      # makes one (charter C-5). The same container path as the agents', so the
      # one `project_keys_dir` in config.yaml names both. Never backed up.
      - ../../.data/credentials/projects:/run/secrets/projects
      # No config.yaml exists in this repo yet — the operator must copy
      # ../../config.example.yaml to ../../config.yaml (and adjust values)
      # at this host path before `docker compose up`.
      - ../../config.yaml:/app/config.yaml:ro
      # The writer's overrides, read-only here (docs/decisions.md ADR 75): the
      # directory, not the file, because the writer swaps the file with a
      # rename. configure.sh creates it so docker does not make it root-owned.
      - ../../config.d:/app/config.d:ro
    depends_on:
      - collector
    networks:
      - ia_harness_net

  # The worker (docs/decisions.md ADR 142 decision 1 and ADR 166): the one
  # long-running service with the docker socket. `dispatch worker` drains
  # <state_dir>/actions/, the queue the board service writes (ADR 142, ADR 148),
  # so the console's Start and Cancel only happen while it runs. Behind the
  # `worker` profile: `docker compose --profile worker up -d worker`. Its mounts
  # are the dispatcher's, copied, and must stay equal to them, plus the backup
  # directory (docs/decisions.md ADR 342): the approve copies the hive and state
  # there before it merges, with the same BACKUP_DIR / BACKUP_KEEP the host's
  # `backup` verb reads.
  worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: docker/dispatcher/Dockerfile
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "worker"]
    environment:
      - BACKUP_DIR=/backups
      - BACKUP_KEEP=${BACKUP_KEEP:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../dispatcher_state:/state
      - ../../.hive:/data/.hive
      - claude_shared:/root/.claude
      - ../../.data/credentials/projects:/run/secrets/projects
      - ../../config.yaml:/app/config.yaml:ro
      - ../../config.d:/app/config.d:ro
      - ${BACKUP_DIR:-../../.data/backups}:/backups
    depends_on:
      - collector
    networks:
      - ia_harness_net

  # Fills <repo-root>/.data/ms-playwright with the headless Chromium every
  # agent mounts read-only at /ms-playwright (docs/decisions.md ADR 43,
  # docs/plans/browser.md). One-shot, behind its own profile so no `up` ever
  # starts it: `docker compose -f docker/compose/docker-compose.yml --profile
  # playwright-install run --rm playwright-install`, once after the agent
  # image is built and again whenever its PLAYWRIGHT_VERSION moves.
  #
  # It is the agent image itself, entrypoint replaced, so the client that
  # downloads the browser is the one the phases run and the version is
  # declared only in docker/agent/Dockerfile. PLAYWRIGHT_BROWSERS_PATH comes
  # from that image's env. The only writable mount of the browser directory
  # is this one.
  playwright-install:
    profiles: ["playwright-install"]
    image: ia-harness-agent
    restart: "no"
    entrypoint: ["playwright", "install", "chromium-headless-shell"]
    volumes:
      - ../../.data/ms-playwright:/ms-playwright
    networks:
      - ia_harness_net

networks:
  # Created by this file, joined as `external: true` by
  # docker-compose.agents.yml so agents/sidecars resolve collector and
  # registry-mirror by service name.
  ia_harness_net:
    name: ia_harness_net
  # The console's side (docs/decisions.md ADR 109): console, caddy, api and
  # config-writer. No agent, sidecar or dind service joins it, and
  # docker-compose.agents.yml never names it. No `name:` key, so no other file
  # can join it as `external` by the bare name.
  console_net:

volumes:
  observability_data:
  registry_mirror_data:
  caddy_data:
  caddy_config:
  claude_shared:
    external: true
