# config.example.yaml
#
# Template for the dispatcher's config.yaml (see dispatcher/config.py for the
# schema this must satisfy). Copy this file to config.yaml at the repo root
# and adjust values for your deployment — docker-compose.yml mounts
# ../../config.yaml into the dispatcher container at /app/config.yaml.
#
# Hostnames below use service names (collector) rather than 127.0.0.1
# because the dispatcher container reaches them over the shared
# ia_harness_net bridge network, not the host's loopback interface.

# One entry per Claude Pro account the dispatcher can dispatch work to.
# `container` must match a container_name in docker-compose.agents.yml.
accounts:
  - name: cuenta1
    container: agent-cuenta1
  - name: cuenta2
    container: agent-cuenta2

# Percentage of an account's quota usage at which the dispatcher stops
# assigning it new work and lets it cool down. Optional; defaults to 90.
quota_threshold_pct: 90

# How long a heartbeat is considered fresh before a lock is treated as
# abandoned and reaped. Optional; defaults to 120.
heartbeat_ttl_seconds: 120

# How often a running role writes a heartbeat. Optional; defaults to 30.
heartbeat_interval_seconds: 30

# Root directory (inside each agent/dind container) under which per-project
# checkouts live, as projects_root/<slug>. Matches the
# ../../.data/projects:/data/projects bind mount in docker-compose.agents.yml
# (host-side, those checkouts live at <repo-root>/.data/projects).
projects_root: /data/projects

# Directory (inside each agent container) holding per-task lock/handoff
# files. Matches the ../../.hive:/data/.hive mount in both compose files.
hive_tasks_dir: /data/.hive/tasks

# Directory (inside the dispatcher container) where dispatcher state is
# persisted. Matches the ../../dispatcher_state:/state mount in
# docker-compose.yml.
state_dir: /state

# Vibe Kanban board. Optional, and commented out on purpose: with no
# `vibe_kanban` block the dispatcher runs exactly as it does today and says
# nothing about a board. Uncomment it only once the command below actually
# runs — the dispatcher spawns it as a subprocess and speaks MCP over stdio
# (the server serves no SSE endpoint, so there is no URL to point at), and
# the shipped dispatcher image has no Node, so `npx` is not on its PATH.
# Either add Node plus `vibe-kanban` to docker/dispatcher/Dockerfile, or
# point `command` at a wrapper of your own. Creating or reading issues also
# needs that server to be signed in to Vibe Kanban's cloud.
#
# vibe_kanban:
#   # Argv, not a shell line: the first element is the executable.
#   command: ["npx", "vibe-kanban@0.1.44", "mcp"]
#   # The project issues are created under, as a uuid. Optional: leave it out
#   # and the server infers it from the workspace it runs in.
#   project_id: 00000000-0000-0000-0000-000000000000
#   # What the board calls each dispatcher status. `update_issue` only accepts
#   # a status name the project already has, and no MCP tool lists those, so
#   # these are the defaults to correct rather than names to trust. The
#   # dispatcher's `in_progress:<role>` maps through `in_progress`; the role
#   # does not reach the board.
#   status_map:
#     in_progress: In Progress
#     blocked: In Review
#     done: Done

# Observability collector URL, reached over ia_harness_net by service name.
collector_url: http://collector:8787

# Model passed as `claude --model <default_model>` for every role
# (arquitecto/implementador/revisor/auditor). Optional; defaults to opus.
default_model: opus

# Cap on implementador/revisor rounds per task: after arquitecto hands off,
# implementador and revisor alternate until the revisor's response ends with
# a literal "VERDICT: APPROVED" line, or this many rounds have run without
# one — at which point the task is marked "blocked" instead of looping
# forever. Optional; defaults to 3.
max_revision_rounds: 3

# Once a revision round exceeds this number without the revisor approving,
# subsequent implementador/revisor rounds run with the `claude --effort` flag
# set to `escalated_effort` instead of the CLI's own default, on the theory
# that a task still bouncing between implementador and revisor this many
# times over may need more reasoning effort, not just another attempt.
# Optional; defaults to 2 (i.e. escalate starting round 3).
escalate_effort_after_round: 2

# Effort level applied once escalate_effort_after_round is exceeded. Passed
# through as the `claude --effort` flag on the agent container's `claude`
# invocation. Optional; defaults to high.
escalated_effort: high

# Wall-clock timeout for a single phase's `claude` invocation, in seconds.
# Bounds a hung run inside the agent container (it's killed there); once
# killed, the phase counts as failed rather than hanging the dispatcher
# indefinitely. Optional; defaults to 7200 (2 hours).
phase_timeout_seconds: 7200

# Whether a task that reaches `done` has its branch merged into whatever
# branch the project's checkout is on, right after the auditor signs off.
# Off by default: the merge is the only thing a run writes into the branch
# you work from, so it waits to be asked for. With this false, the same
# merge is available by hand, whenever you have looked at the result:
#   python -m dispatcher.cli --config config.yaml merge-task \
#     --task-id T-001 --project my-project
# Either way it is a --no-ff merge that refuses on a dirty tree and rolls
# itself back on a conflict, and the task branch always survives.
# Optional; defaults to false.
merge_on_done: false

# A project with no docs index (docs/README.md) gets one mapping phase before
# the arquitecto: a read-only role that walks the checkout and writes the
# index, docs/architecture.md and docs/business.md, so later tasks read the
# project instead of rediscovering it. Off by default, because it is a phase
# that spends quota and ships no code — with this false a project is only ever
# documented by the roles that do the work. The phase is never fatal: if it
# fails, the task runs anyway with whatever docs exist.
# Optional; defaults to false.
mapping_enabled: false

# Model for that phase, separate from default_model: the mapper reads and
# summarises rather than designs, so it is the one phase worth running cheap.
# Optional; defaults to sonnet.
mapping_model: sonnet

# Hard turn budget for that phase, passed as `claude --max-turns`. The run is
# cut off there, and whatever the mapper wrote up to that point is committed —
# a thin index beats an unbounded bill. Must be a positive integer.
# Optional; defaults to 40.
mapping_max_turns: 40

# The dispatcher's own checks on the implementador's worktree, run between it
# and the revisor: a change with no test, the project's test command failing,
# a contract touched with no doc, a docs pointer whose target is gone. They
# run through `docker exec` with no model in the loop, so they spend no quota,
# and they are the one thing here that is on by default — a finding they catch
# costs a revisor call and another round when it reaches review instead.
# Failing tests send the round back without paying for a review; the rest ride
# along under the handoff for the revisor to judge.
# Optional; defaults to true.
gates_enabled: true

# Wall-clock timeout for the test command that gate runs, in seconds. Far
# shorter than phase_timeout_seconds, because that one bounds a model working
# and this one bounds a suite: a suite still running after this is reported as
# such and the task goes to review anyway, rather than holding the lock open.
# Must be a positive integer. Optional; defaults to 900 (15 minutes).
gates_test_timeout_seconds: 900
