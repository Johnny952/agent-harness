# config.example.yaml
#
# Template for the dispatcher's config.yaml (see dispatcher/config.py for the
# schema this must satisfy). Copy this file to config.yaml at the repo root
# and adjust values for your deployment — docker-compose.yml mounts
# ../../config.yaml into the dispatcher container at /app/config.yaml.
#
# Hostnames below use service names (collector) rather than 127.0.0.1
# because the dispatcher container reaches them over the shared
# ia_harness_net bridge network, not the host's loopback interface.
#
# This file holds the defaults. A config.d/overrides.yaml beside it, if present,
# is merged over it: each top-level key there replaces this file's value whole,
# maps and lists included. Only the keys CONFIG_KEYS in dispatcher/config.py
# marks editable may appear. A reset is deleting the key; null is refused. A
# bad overrides file stops every verb, and the dispatcher never falls back to
# this file alone. config.d/ is git-ignored. The config-writer service writes it
# (docs/plans/console-config.md task 2); the dispatcher and the api mount it :ro.

# One entry per Claude Pro account the dispatcher can dispatch work to.
# `container` must match a container_name in docker-compose.agents.yml.
accounts:
  - name: cuenta1
    container: agent-cuenta1
  - name: cuenta2
    container: agent-cuenta2
    # Phases this account may hold at once. Default 1; raise it only on a Max
    # account (ADR 84). `--parallel` is still the ceiling on the whole run.
    # max_concurrent_phases: 2

# Which of the accounts above is the operator's own console. It is not kept
# out of the pool, it ranks last in it, so "every worker is out of quota" is
# just the ordering running off its end. Omit the key for a flat pool in the
# order listed above; an unknown name is a config error. Optional; no default,
# because the primary is named here and never guessed in code.
primary_account: cuenta1

# Percentage of an account's quota usage at which the dispatcher stops
# assigning it new work and lets it cool down. Applies to the workers; the
# primary's session answers to reserve_pct below, and its week to the paced
# ceiling under that. Optional; defaults to 90.
quota_threshold_pct: 90

# The line below which the primary accepts fallback work at all, and the
# ceiling its five-hour session is parked on in place of quota_threshold_pct.
# Above it the pool reports itself dry rather than spending the operator's own
# console to the wall. Its week answers to the paced ceiling below instead,
# and falls back to this number when no reset can be read. An explicit value
# above quota_threshold_pct is a config error, not a clamp. Optional; defaults
# to 60, or to quota_threshold_pct when that is stricter.
reserve_pct: 60

# Pace the primary's weekly spend against its own reset instead of holding the
# week to the flat reserve_pct. With d days from the probe to the reset that
# `/usage` reported, the week may be spent to 10% while d is over 6, rising
# linearly to 95% over the following days, and 95% through the last one — less
# 5 points held back for the phase that runs after the probe. The reset is
# reread at every probe and never configured, because a week starts at a
# moment set by the account's own history. `false` restores the older
# behaviour exactly: reserve_pct on both of the primary's windows. The ramp's
# own numbers are constants in dispatcher/quota.py, not keys. Optional;
# defaults to true.
pace_primary_week: true

# The phases the primary will take as fallback. A revisor or an auditor reads
# a diff and writes a verdict; an implementador writes code across up to
# max_revision_rounds rounds, so the primary will not start one unless this
# list says so. Optional; defaults to [revisor, auditor].
fallback_roles:
  - revisor
  - auditor

# How long an account that the service actually refused (a 429 on a real
# phase, or on the quota probe itself) is held out of the pool. The probe the
# dispatcher runs is the CLI's local `/usage`, which reads counters on this
# machine and cannot see a refusal at all, so without this floor a refused
# account is recovered on healthy local numbers and handed straight back the
# work it was just refused. Optional; defaults to 1800 (half an hour).
quota_cooldown_seconds: 1800

# How long a heartbeat is considered fresh before a lock is treated as
# abandoned and reaped. Optional; defaults to 120.
heartbeat_ttl_seconds: 120

# How often a running role writes a heartbeat. Optional; defaults to 30.
heartbeat_interval_seconds: 30

# Root directory (inside each agent/dind container) under which per-project
# checkouts live, as projects_root/<slug>. Matches the
# ../../.data/projects:/data/projects bind mount in docker-compose.agents.yml
# (host-side, those checkouts live at <repo-root>/.data/projects).
projects_root: /data/projects

# Directory (inside each agent container) holding per-task lock/handoff
# files. Matches the ../../.hive:/data/.hive mount in both compose files.
hive_tasks_dir: /data/.hive/tasks

# Directory (inside the dispatcher container) where dispatcher state is
# persisted. Matches the ../../dispatcher_state:/state mount in
# docker-compose.yml.
state_dir: /state

# Observability collector URL, reached over ia_harness_net by service name.
collector_url: http://collector:8787

# Model passed as `claude --model <default_model>` for every role
# (arquitecto/implementador/revisor/auditor) that role_model below does not
# name. Optional; defaults to claude-opus-5-5. A full ID rather than an alias,
# so the model a run used is the one written here; it needs an agent image
# whose CLI knows it (2.1.296+).
default_model: claude-opus-5-5

# A model per role over default_model, on every call that role's phase makes,
# its handoff resumes included. Roles: arquitecto, implementador, revisor,
# auditor, and arquitecto-draft for the arquitecto's `draft-specs` run (which
# takes the arquitecto's model when unset). A cartografo entry is refused at
# load: the cartografo's model is mapping_model, below. An unknown role, or a value that is not a non-empty
# model ID, is refused at load too. Precedence: role_model, then
# default_model. The effort escalation changes the effort, never the model.
# Optional; defaults to none.
# role_model:
#   implementador: claude-sonnet-5-5

# Permission mode passed as `claude --permission-mode <mode>` on every call
# that runs a role's own work. Without it the CLI runs `-p` with nobody able
# to answer a permission prompt and denies instead of asking, so a phase
# cannot write files — not even inside its own worktree.
#   acceptEdits      auto-accepts file edits, and allows the CLI's own
#                    read-only Bash set (ls, cat, grep, git status/log/diff)
#                    plus the file-creating ones like `mkdir -p`. What it
#                    refuses is running a program, `git add`/`git commit`,
#                    and any path outside the working directory and the
#                    add-dirs — see allowed_tools below for the first of those
#   auto             a model classifier decides; also covers Bash, but the
#                    server can report it unavailable
#   plan / manual / dontAsk / bypassPermissions  the CLI's other choices;
#                    bypassPermissions is refused outright when the CLI runs
#                    as root, which the agent image does
# Optional; defaults to acceptEdits. Set it to null to send no flag at all.
permission_mode: acceptEdits

# Tool patterns passed as `claude --allowed-tools <patterns...>` on every call
# that runs a role's own work, on top of whatever permission_mode grants. The
# two are independent: measured on 2026-09-23, an allowlist with no mode at
# all still ran the command, and acceptEdits without one still refused it.
#
# This is what lets a phase prove its own work. In the first end-to-end run
# the implementador and the revisor each tried `node --test` and were denied
# every time, so the task's own acceptance criterion was unreachable and the
# revisor correctly blocked it: the code had never executed. A phase cannot
# fix that for itself — writing its own .claude/settings.local.json is
# refused too, and a CLI flag is not on disk for it to reach — so the grant
# has to come from here, which is also what keeps it honest.
#
# Entries look like `Bash(<command prefix>*)`. Keep them narrow: the trailing
# `*` already lets arguments through, so `Bash(npm test*)` is a test runner
# while `Bash(npm*)` is `npm install <anything>`. Patterns containing a space
# survive intact.
#
# The list is flat while `projects_root` holds more than one project, so it
# ends up the union of what each declares — a Node project's `node --test`
# and a Python one's `python3 -m pytest` side by side. A role only ever gets
# to run the one its own project actually has.
#
# Optional; defaults to empty, which sends no flag. What a project's phases
# may run is a decision about that project, so nothing is assumed — but note
# that leaving it empty means the test gate is the only thing that ever runs
# the code.
#
# The `bun` entries are front/'s `install:` and `test:` commands in this
# repo's own docs/README.md, its lint among the `test:` ones since C-11; drop them if no project under `projects_root`
# has a front/. Install is the frozen-lockfile form only, because a fresh
# worktree has no node_modules and a phase should not change the lockfile.
allowed_tools:
  - Bash(node --test*)
  - Bash(python3 -m pytest*)
  - Bash(bun install --frozen-lockfile*)
  - Bash(bun run typecheck*)
  - Bash(bun run test*)
  - Bash(bun run lint*)

# Cap on implementador/revisor rounds per task: after arquitecto hands off,
# implementador and revisor alternate until the revisor's response ends with
# a literal "VERDICT: APPROVED" line, or this many rounds have run without
# one — at which point the task is marked "blocked" instead of looping
# forever. Optional; defaults to 3.
max_revision_rounds: 3

# The effort every phase runs at, passed as `claude --effort` on every phase
# rather than left to the CLI's own default: low, medium, high, xhigh or max.
# `medium` is Opus 5.5's default and the plan's starting level for every role
# (docs/plans/models-5-5.md, Decisions 2); change a level only after measuring
# it on real tasks. Changing it between rounds of one session costs that
# session its prompt cache. Optional; defaults to medium.
default_effort: medium

# A level per role over default_effort. Roles: arquitecto, implementador,
# revisor, auditor, cartografo. An unknown role or level is refused at load.
# Optional; defaults to none.
# role_effort:
#   revisor: high

# Once a revision round exceeds this number without the revisor approving,
# subsequent implementador/revisor rounds run with the `claude --effort` flag
# set to `escalated_effort` instead of the role's own level, on the theory
# that a task still bouncing between implementador and revisor this many
# times over may need more reasoning effort, not just another attempt.
# Optional; defaults to 2 (i.e. escalate starting round 3).
escalate_effort_after_round: 2

# Effort level applied once escalate_effort_after_round is exceeded. Passed
# through as the `claude --effort` flag on the agent container's `claude`
# invocation. Optional; defaults to high.
escalated_effort: high

# Escalate sooner when the revisor sends a round back for a finding it already
# sent the previous review back for: the next implementador round then runs at
# `escalated_effort` whatever the round count says. "The same finding" is a
# line of the revisor's `findings` (or a debt it rejected) that matches one of
# the last review's after normalizing case, punctuation and numbers, not a
# judgement about prose (docs/decisions.md ADR 73). The round-count rule above
# still applies, so this can only escalate sooner; with its defaults (round 3
# of 3) it already escalates the only round this could, and the signal starts
# to matter once escalate_effort_after_round is raised. Optional; defaults to
# false, which is the round-count rule alone.
escalate_effort_on_repeated_finding: false

# A phase that ends without its structured handoff (a turn closed on a
# progress report, say) is resumed with one short "continue" line, up to this
# many times, before it counts as a failed phase. Each resume is a model call
# on the run already authorized. 0 fails such a phase at once. Optional;
# defaults to 2.
max_handoff_resumes: 2

# Wall-clock timeout for a single phase's `claude` invocation, in seconds.
# Bounds a hung run inside the agent container (it's killed there); once
# killed, the phase counts as failed rather than hanging the dispatcher
# indefinitely. Optional; defaults to 7200 (2 hours).
phase_timeout_seconds: 7200

# Whether a task that reaches `done` has its branch merged into whatever
# branch the project's checkout is on, right after the auditor signs off.
# Off by default: the merge is the only thing a run writes into the branch
# you work from, so it waits to be asked for. With this false, the same
# merge is available by hand, whenever you have looked at the result:
#   python -m dispatcher.cli --config config.yaml merge-task \
#     --task-id T-001 --project my-project
# Either way it is a --no-ff merge that refuses on a dirty tree and rolls
# itself back on a conflict, and the task branch always survives.
# Optional; defaults to false.
merge_on_done: false

# Per project, merge a finished task only when every condition of the
# automatic approve holds (docs/plans/autonomy.md, Decisions 1; ADR 77): every
# gate green, the revisor approved with no open finding, the auditor with no
# finding and no debt filed this cycle, the pre-merge check passed, every
# changed path inside the task's Surface section and none of them protected,
# and the cycle started by a person (run-task). A failed condition leaves the
# task done and unmerged, with a comment on the task naming it. A task with no
# path in its Surface section is never approved automatically. A project with
# this on gets the check even when merge_on_done is true; a project not named
# here behaves as merge_on_done says. Optional; defaults to no project.
# auto_approve:
#   my-project: true

# Per project, more repo paths or globs the automatic approve never merges a
# change to, over the fixed list: docs/charter.md, .env* (anywhere),
# config.yaml, docker/compose/**, .data/**, and the credential paths above
# when they fall inside the project. Optional.
# protected_paths:
#   my-project:
#     - migrations/**
#     - infra/

# Whether a task fetches the project's remote and fast-forwards the project's
# own checkout before its first phase runs, so the branch it cuts is not taken
# from a base that went stale while nobody was looking. Runs once per task, at
# the only moment it is safe: before the first worktree exists. Off by default,
# like merge_on_done and for a neighbouring reason — this one reaches the
# network, and against a private remote it also needs a credential the operator
# has to put on the host first (see git_credentials_path), without which every
# task would open with a warning it cannot act on. Optional; defaults to false.
#
# It only ever fast-forwards. A checkout that is *ahead* of its remote is left
# alone, because that is the ordinary state after merge_on_done or `merge-task`
# landed a branch nobody has pushed yet. A checkout that is ahead *and* behind
# has diverged, and reconciling that is a merge: the task ends `blocked` saying
# so rather than inventing a decision nobody gave it. An update that could not
# be attempted at all — an ssh:// remote, or a fetch that failed, a private
# remote with no credential mounted for it among the ways it can — is a
# warning and not a stop, because the base is then exactly as stale as it was
# before any of this existed.
update_project_before_task: false

# Where update_project_before_task looks for a credential, inside the agent
# container. A public remote over https:// needs none, and a missing file is
# not a stop: it is probed, and git is told about it only when it is there. For
# a private remote, one line in git's `store` format:
#   https://<user>:<token>@github.com
# Nothing here pushes, so a read-only (fine-grained, contents: read) token is
# enough. The file lives on the host and is bind-mounted read-only into every
# agent by docker-compose.agents.yml, which is both why the containers can be
# thrown away without logging each one in again and why it must never be passed
# as an environment variable: run_docker_exec puts env on the `docker exec`
# argv, where any `ps` on the host reads it. This credential only answers for
# an https:// remote; a project with a deploy key (project_keys_dir) uses that
# instead. Optional; defaults to /run/secrets/git-credentials.
git_credentials_path: /run/secrets/git-credentials

# Where each project's SSH deploy key is, inside the containers: one directory
# per project slug holding id_ed25519 and id_ed25519.pub. On the host it is
# .data/credentials/projects, mounted read-only into the agents and writable
# into the dispatcher's container, and never backed up. Make a key with
#   dispatch project-keygen --project <slug>
# which prints only the public half and its fingerprint; add that half under the
# repository's Settings -> Deploy keys. A deploy key opens that one repository,
# where a token usually opens every repository of its owner. A project with a
# key fetches over SSH with it: an SSH remote as it is, and an
# https://github.com/ clone through a one-command url.insteadOf, so the remote
# is never rewritten. A project with no key keeps the https:// credential above.
# Only github.com's host keys are pinned in the agent image. Optional; defaults
# to /run/secrets/projects.
project_keys_dir: /run/secrets/projects

# A project with no docs index (docs/README.md) gets one mapping phase before
# the arquitecto: a read-only role that walks the checkout and writes the
# index, docs/architecture.md and docs/business.md, so later tasks read the
# project instead of rediscovering it. Off by default, because it is a phase
# that spends quota and ships no code — with this false a project is only ever
# documented by the roles that do the work. The phase is never fatal: if it
# fails, the task runs anyway with whatever docs exist.
# Optional; defaults to false.
mapping_enabled: false

# Model for that phase, separate from default_model: the mapper reads and
# summarises rather than designs, so it is the one phase worth running cheap.
# Optional; defaults to claude-sonnet-5-5.
mapping_model: claude-sonnet-5-5

# Hard turn budget for that phase, passed as `claude --max-turns`. The run is
# cut off there, and whatever the mapper wrote up to that point is committed —
# a thin index beats an unbounded bill. Must be a positive integer.
# Optional; defaults to 40.
mapping_max_turns: 40

# Tool patterns granted to the mapping phase alone, on top of allowed_tools
# (ADR 115). The mapper runs Claude Code's /run-skill-generator first, and the
# generator records as working only what it could run: with the list empty
# mapping still runs, and a refused command is left out of the skill and of
# the index's build:/test:/install: keys rather than guessed. Every other
# phase keeps allowed_tools exactly, and permission_mode is not changed for
# mapping. The owner fills this per the projects in `projects_root`, for
# example Bash(docker compose*), Bash(npm *) or Bash(make*). Same shape as
# allowed_tools, read-only in the console. Optional; defaults to [].
# mapping_allowed_tools: []

# The dispatcher's own checks on the implementador's worktree, run between it
# and the revisor: a change with no test, the project's test command failing,
# a contract touched with no doc, a docs pointer whose target is gone. They
# run through `docker exec` with no model in the loop, so they spend no quota,
# and they are the one thing here that is on by default — a finding they catch
# costs a revisor call and another round when it reaches review instead.
# Failing tests send the round back without paying for a review; the rest ride
# along under the handoff for the revisor to judge.
# Optional; defaults to true.
gates_enabled: true

# Wall-clock timeout for the test command that gate runs, in seconds. Far
# shorter than phase_timeout_seconds, because that one bounds a model working
# and this one bounds a suite: a suite still running after this is reported as
# such and the task goes to review anyway, rather than holding the lock open.
# Must be a positive integer. Optional; defaults to 900 (15 minutes).
gates_test_timeout_seconds: 900
